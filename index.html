<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Ladeira Abaixo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-screen portrait slope — title strip, tall engineering-pad board (blueprint in dark), thumb-reach control strip */
:root{
  --paper:#f1f4ea; --grid:#d6e2ca; --grid-major:#b3c9a2;
  --desk:#dde4d1; --panel:#e9eee0; --edge:#b6c5a8;
  --ink:#1d3f9e; --graphite:#262b24; --muted:#5b6753;
  --car:#d4252c; --on-car:#ffffff; --glass:#cfe6f2;
  --skin:#f0c29c; --pants:#2c3a66; --blood:#a5101a;
  --hazard:#efb21a; --ok:#1f8446; --bad:#c22a2a;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15396a; --grid:#1d4780; --grid-major:#2f5f9f;
    --desk:#0b2040; --panel:#112c52; --edge:#2b5690;
    --ink:#f3efdc; --graphite:#e6edf7; --muted:#9fb5d4;
    --car:#ff5a52; --on-car:#2a0606; --glass:#bfe3ff;
    --skin:#f5cfae; --pants:#1b2440; --blood:#e3263a;
    --hazard:#ffb627; --ok:#62d68b; --bad:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15396a; --grid:#1d4780; --grid-major:#2f5f9f;
  --desk:#0b2040; --panel:#112c52; --edge:#2b5690;
  --ink:#f3efdc; --graphite:#e6edf7; --muted:#9fb5d4;
  --car:#ff5a52; --on-car:#2a0606; --glass:#bfe3ff;
  --skin:#f5cfae; --pants:#1b2440; --blood:#e3263a;
  --hazard:#ffb627; --ok:#62d68b; --bad:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--desk);color:var(--graphite);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
.bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-hand);font-weight:700;font-size:2rem;line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{margin-left:auto;display:flex;gap:8px;min-width:0}
select{font:600 .95rem/1.2 var(--f-ui);padding:.6rem .7rem;border-radius:8px;border:1.5px solid var(--edge);background:var(--panel);color:var(--graphite);min-width:0;max-width:16rem}
select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.board{flex:1;min-height:0;display:grid;place-items:center;position:relative}
canvas{display:block;border-radius:6px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1.5px var(--edge),0 14px 30px -20px rgba(0,0,0,.55)}
canvas.busy{cursor:default}
.controls{justify-content:space-between}
.info{margin:0;flex:1 1 16rem;min-width:0;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
button{font:600 .95rem/1 var(--f-ui);padding:.65rem 1rem;border-radius:8px;border:1.5px solid var(--edge);background:var(--panel);color:var(--graphite);cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--graphite)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.primary{background:var(--car);border-color:var(--car);color:var(--on-car);font-weight:800;min-width:8rem}
/* sideways: board on the left, controls in a column on the right */
.app.land{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 10rem;grid-template-rows:auto 1fr;gap:8px 12px}
.app.land .board{grid-column:1;grid-row:1/3}
.app.land header,.app.land footer{grid-column:2;flex-direction:column;align-items:stretch;gap:8px}
.app.land footer{grid-row:2;justify-content:flex-end}
.app.land h1{font-size:1.45rem}
.app.land .tag,.app.land .info .more{display:none}
.app.land .pick{margin-left:0;flex-direction:column}
.app.land select{max-width:none}
.app.land .info{flex:0 0 auto}
.app.land .controls .btns{flex-direction:column}
.app.land .controls .btns button{height:2.9rem}
.app.land button.primary{min-width:0}
/* phone held sideways with rotation lock: turn the whole app a quarter */
body.turn .app{position:fixed;top:0;left:var(--vw);width:var(--vh);height:var(--vw);margin:0;transform-origin:0 0;transform:rotate(90deg)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;display:grid;gap:.7rem;max-width:22rem;background:var(--paper);border:2px solid var(--graphite);border-radius:10px;padding:1.1rem 1.3rem 1.2rem;box-shadow:6px 6px 0 var(--graphite)}
.card h2{margin:0;font-family:var(--f-hand);font-weight:700;font-size:2.1rem;line-height:1.05;color:var(--bad);text-wrap:balance}
.card[data-kind="win"] h2{color:var(--ok)}
.card p{margin:0;line-height:1.45}
.card .btns button{flex:1}
@media (max-width:560px){
  .app{padding-inline:12px;gap:6px}
  h1{font-size:1.5rem}
  .tag,.info .more{display:none}
  .app:not(.land) .pick{margin-left:0;width:100%}
  .app:not(.land) select{flex:1;max-width:none}
  .app:not(.land) .info{flex-basis:100%;text-align:center}
  .app:not(.land) .controls .btns{width:100%}
  .app:not(.land) .controls .btns button{flex:1;height:3.2rem;padding:0 .5rem}
  .app:not(.land) button.primary{min-width:0;flex:1.6!important}
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>Ladeira Abaixo</h1><span class="tag">esqui sem bastão · só gravidade</span></div>
    <div class="pick">
      <select id="lvlSel" aria-label="Fase"></select>
      <button id="turn" title="Trocar entre jogar em pé e deitado">⟳ Deitar</button>
    </div>
  </header>
  <main class="board" id="board">
    <canvas id="cv" aria-label="Montanha: arraste para desenhar a pista de neve"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="card" role="dialog" aria-live="polite">
        <h2 id="cTitle"></h2>
        <p id="cText"></p>
        <div class="btns"><button id="retry">Tentar de novo</button><button id="next" class="primary">Próxima fase</button></div>
      </div>
    </div>
  </main>
  <footer class="bar controls">
    <p class="info"><span id="info"></span><span class="more" id="more"></span></p>
    <div class="btns">
      <button id="undo">Desfazer</button>
      <button id="clear">Limpar</button>
      <button id="play" class="primary">▶ Play</button>
    </div>
  </footer>
</div>

<script>
// World units: 100 px = 1 m, portrait slope. The skier rides on two ski contact points joined by a rigid
// link (position-based dynamics); the body is drawn on top and only checked for hits.
let W = 700, H = 1000; const PX = 100, G = 9.81 * PX, R = 9, AXLE = 36, SUB = 10;
const CRASH_V = 750, VMAX = 2500, GOAL_R = 42, ROLL = 25, DRAG = 0.04, SPIN = 3.5, T_MAX = 40;
// Levels are authored for the 700×1000 portrait slope; sideways play stretches them to 1000×700.
// start: launch pad [x1,y1,x2,y2] (skier faces from 1 to 2); goal: [x,y]
// haz: deadly rects [x,y,w,h] — moving ones add [dx,dy,period s,phase 0..1] and sweep from x,y to x+dx,y+dy and back
const LEVELS = [
  { name: "Primeira descida", start: [30,110,150,145], goal: [600,880], haz: [] },
  { name: "Desvio", start: [30,110,150,145], goal: [620,880], haz: [[0,620,320,50]] },
  { name: "Por baixo da ponte", start: [670,110,550,145], goal: [100,880], haz: [[0,0,280,520],[330,700,370,300]] },
  { name: "Funil", start: [30,110,150,145], goal: [410,880], haz: [[0,640,330,360],[480,640,220,360]] },
  { name: "Pedras", start: [30,110,150,145], goal: [620,880], haz: [[350,250,350,80],[0,700,330,300]] },
  { name: "Agulha", start: [30,110,150,145], goal: [620,900], haz: [[0,380,240,40],[350,380,350,40],[0,720,420,280]] },
  // moving obstacles from here on
  { name: "Vai e vem", start: [30,110,150,145], goal: [600,880], haz: [[100,420,110,40,330,0,2.6,0]] },
  { name: "Elevador", start: [30,110,150,145], goal: [620,880], haz: [[0,620,320,50],[470,520,90,40,0,320,2.2,.9]] },
  { name: "Portão", start: [30,110,150,145], goal: [410,880], haz: [[0,640,330,360],[480,640,220,360],[160,590,100,30,220,0,2.6,.18]] },
  { name: "Martelos", start: [30,110,150,145], goal: [600,880], haz: [[200,250,60,60,0,260,1.6,.85],[420,480,60,60,0,260,1.6,.35]] },
  { name: "Ponte levadiça", start: [670,110,550,145], goal: [100,880], haz: [[0,0,280,520],[330,700,370,300],[190,500,80,40,0,170,2.4,.05]] },
  { name: "Esteiras", start: [30,110,150,145], goal: [600,880], haz: [[0,300,120,30,520,0,3,.2],[0,520,120,30,520,0,3,.53],[0,740,120,30,520,0,3,.86]] },
  { name: "Agulha móvel", start: [30,110,150,145], goal: [620,900], haz: [[0,380,200,40,130,0,2.4,.15],[320,380,380,40,130,0,2.4,.15],[0,720,420,280]] },
  { name: "Chuva de pedras", start: [30,110,150,145], goal: [600,880], haz: [[230,-60,50,50,0,1000,1.8,.35],[420,-60,50,50,0,1000,1.8,.85]] },
  { name: "Correnteza", start: [30,110,150,145], goal: [600,880], haz: [[0,250,200,60],[0,560,240,60,440,0,3.2,.3]] },
  { name: "Grande final", start: [30,110,150,145], goal: [620,880], haz: [[350,250,350,80],[0,700,330,300],[340,600,60,60,220,0,1.6,.6],[560,640,60,60,0,140,1.4,.6]] },
];
let land = false; // sideways play
const levelCache = {};
function levelFor(i) { // the level as played in the current orientation
  const key = land + ":" + i;
  if (!levelCache[key]) {
    const src = LEVELS[i], sx = land ? 1000 / 700 : 1, sy = land ? 700 / 1000 : 1;
    levelCache[key] = { name: src.name,
      start: src.start.map((v, j) => v * (j % 2 ? sy : sx)), goal: [src.goal[0] * sx, src.goal[1] * sy],
      haz: src.haz.map(h => h.map((v, j) => j < 6 ? v * (j % 2 ? sy : sx) : v)) };
  }
  return levelCache[key];
}
let tHaz = 0; // obstacle clock: runs freely while drawing, restarts at 0 on Play so every run is the same
function hazAt(h, t = tHaz) {
  if (h.length < 5) return h;
  const k = (1 - Math.cos(2 * Math.PI * (t / h[6] + h[7]))) / 2;
  return [h[0] + h[4] * k, h[1] + h[5] * k, h[2], h[3]];
}
// Skier parts in local coords (x forward, y down from the rear ski contact). Drawn intact, then torn apart on a crash.
const PARTS = [
  { a: [-10, 9], b: [50, 9], w: 3, k: "graphite", ski: true },
  { a: [31, -20], b: [4, 7], w: 1.6, k: "graphite" },
  { a: [24, -4], b: [18, 6], w: 5, k: "pants", bleed: 1 },
  { a: [15, -14], b: [24, -4], w: 5.5, k: "pants", bleed: 1 },
  { a: [15, -14], b: [21, -30], w: 8, k: "car", bleed: 1.6 },
  { a: [21, -28], b: [31, -20], w: 4.5, k: "car", bleed: 1 },
  { a: [25, -38], b: [25, -38], w: 11, k: "skin", head: true, bleed: 2 },
];
const PROBES = [[25,44],[30,38],[21,30],[13,14],[31,20]]; // (forward, up): head, shoulder, hip, hand never touch the snow

const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d"), board = $("#board");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lvl = 0, done = new Set(), cleared = null;
const sketches = { false: LEVELS.map(() => []), true: LEVELS.map(() => []) }; // one drawing per level per orientation
let drawings = sketches[false];
let segs = [], state = "edit", car = null, stroke = null, parts = [], rag = [], drops = [], stains = [];
let tRun = 0, best = 0, stale = 0, vNow = 0, endTimer = 0;
try { JSON.parse(localStorage.getItem("ladeira-ski-done") || "[]").forEach(i => done.add(i)); } catch {}
try { land = localStorage.getItem("ladeira-land") === "1"; } catch {}

const L = () => levelFor(lvl);
const fmt = (v, d = 1) => v.toFixed(d).replace(".", ",");
const m = v => fmt(v / PX) + " m", ms = v => fmt(v / PX) + " m/s", sec = t => fmt(t) + " s";
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function rebuild() {
  segs = [];
  const add = (x1, y1, x2, y2) => {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    if (l2 < 1e-6) return;
    segs.push({ x1, y1, dx, dy, l2, minx: Math.min(x1, x2) - R, maxx: Math.max(x1, x2) + R, miny: Math.min(y1, y2) - R, maxy: Math.max(y1, y2) + R });
  };
  add(...L().start);
  for (const st of drawings[lvl]) for (let i = 1; i < st.length; i++) add(st[i-1][0], st[i-1][1], st[i][0], st[i][1]);
}
function closest(px, py, s) {
  const t = clamp(((px - s.x1) * s.dx + (py - s.y1) * s.dy) / s.l2, 0, 1);
  return [s.x1 + s.dx * t, s.y1 + s.dy * t];
}
// nearest track point within r of (px,py): [qx, qy, dist] or null
function touch(px, py, r) {
  let hit = null;
  for (const s of segs) {
    if (px < s.minx - r || px > s.maxx + r || py < s.miny - r || py > s.maxy + r) continue;
    const [qx, qy] = closest(px, py, s), d = Math.hypot(px - qx, py - qy);
    if (d < r && (!hit || d < hit[2])) hit = [qx, qy, d];
  }
  return hit;
}

function spawn() {
  const [x1, y1, x2, y2] = L().start, l = Math.hypot(x2 - x1, y2 - y1), dx = (x2 - x1) / l, dy = (y2 - y1) / l;
  let nx = dy, ny = -dx; if (ny > 0) { nx = -nx; ny = -ny; }
  const ax = x1 + dx * 16 + nx * (R + .5), ay = y1 + dy * 16 + ny * (R + .5);
  car = { s: Math.sign(dx) || 1, w: [{ x: ax, y: ay, vx: 0, vy: 0 }, { x: ax + dx * AXLE, y: ay + dy * AXLE, vx: 0, vy: 0 }] };
}
function basis() {
  const [a, b] = car.w, l = Math.hypot(b.x - a.x, b.y - a.y) || 1, ux = (b.x - a.x) / l, uy = (b.y - a.y) / l;
  return { ux, uy, nx: car.s * uy, ny: -car.s * ux }; // n = the skier's "up"
}
function local(x, y) { const a = car.w[0], f = basis(); return [a.x + f.ux * x + f.nx * y, a.y + f.uy * x + f.ny * y]; }

// ---- physics ----
function link(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = (d - AXLE) / d / 2;
  a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k;
}
function collide(w) {
  for (const s of segs) {
    if (w.x < s.minx || w.x > s.maxx || w.y < s.miny || w.y > s.maxy) continue;
    const [qx, qy] = closest(w.x, w.y, s);
    let ex = w.x - qx, ey = w.y - qy, d = Math.hypot(ex, ey);
    if (d >= R) continue;
    if (d < 1e-4) { const l = Math.sqrt(s.l2); ex = s.dy / l; ey = -s.dx / l; d = 0; } else { ex /= d; ey /= d; }
    w.x += ex * (R - d); w.y += ey * (R - d); w.c = true; w.nx = ex; w.ny = ey;
    const vn = w.vx * ex + w.vy * ey; // approach speed before this step
    if (vn < -100) impact = true;
    if (vn < -CRASH_V && state === "run") end("crash", "Pancada forte!", `Bateu a ${ms(-vn)} contra a neve. O esquiador aguenta até ${ms(CRASH_V)}.`);
  }
}
// ½v² + g·height for both contacts (per unit mass; y grows downward)
const energy = () => car.w.reduce((e, w) => e + (w.vx * w.vx + w.vy * w.vy) / 2 - G * w.y, 0);
let impact = false;
function physics(dt) {
  const h = dt / SUB, [a, b] = car.w;
  for (let s = 0; s < SUB; s++) {
    const e0 = energy(); impact = false;
    for (const w of car.w) {
      w.vy += G * h;
      const sp = Math.hypot(w.vx, w.vy); if (sp > VMAX) { w.vx *= VMAX / sp; w.vy *= VMAX / sp; }
      w.ox = w.x; w.oy = w.y; w.x += w.vx * h; w.y += w.vy * h; w.c = false;
    }
    for (let it = 0; it < 3; it++) { link(a, b); collide(a); collide(b); }
    if (state !== "run") return;
    for (const w of car.w) { w.vx = (w.x - w.ox) / h; w.vy = (w.y - w.oy) / h; }
    // a polyline bends in small kinks and each kink eats speed; give back that numeric loss so the
    // track behaves like a smooth, ideal slope. Real hits (impact) and the losses below still count.
    const e1 = energy(), ke = car.w.reduce((k, w) => k + (w.vx * w.vx + w.vy * w.vy) / 2, 0);
    if (!impact && e1 < e0 && ke > 1) {
      const f = Math.min(1.05, Math.sqrt((ke + e0 - e1) / ke));
      for (const w of car.w) { w.vx *= f; w.vy *= f; }
    }
    for (const w of car.w) {
      w.vx *= 1 - DRAG * h; w.vy *= 1 - DRAG * h;
      if (w.c) { // snow friction along the surface
        const tx = -w.ny, ty = w.nx, vt = w.vx * tx + w.vy * ty, dv = Math.min(Math.abs(vt), ROLL * h) * Math.sign(vt);
        w.vx -= tx * dv; w.vy -= ty * dv;
      }
    }
    if (!a.c && !b.c) { // airborne: bleed off spin (arcade tweak, keeps jumps off curves playable)
      const l = Math.hypot(b.x - a.x, b.y - a.y) || 1, px = -(b.y - a.y) / l, py = (b.x - a.x) / l;
      const k = ((b.vx - a.vx) * px + (b.vy - a.vy) * py) * (1 - Math.exp(-SPIN * h)) / 2;
      a.vx += px * k; a.vy += py * k; b.vx -= px * k; b.vy -= py * k;
    }
  }
}
function update(dt) {
  tRun += dt;
  physics(dt);
  if (state !== "run") return;
  const [a, b] = car.w, f = basis(), probes = PROBES.map(p => local(...p));
  if (probes.some(([px, py]) => touch(px, py, 2.5))) return end("crash", "Caiu de cabeça!", "O corpo do esquiador bateu na neve. Curvas fechadas e lombadas derrubam ele.");
  tHaz = tRun;
  for (const hz of L().haz) {
    const [hx, hy, hw, hh] = hazAt(hz);
    const hitW = car.w.some(w => (w.x - clamp(w.x, hx, hx + hw)) ** 2 + (w.y - clamp(w.y, hy, hy + hh)) ** 2 < R * R);
    const hitP = probes.some(([px, py]) => px > hx && px < hx + hw && py > hy && py < hy + hh);
    if (hitW || hitP) return end("crash", "Bateu na pedra!", "O esquiador encostou na área listrada. Desvie dela com a pista.");
  }
  if (car.w.some(w => w.y > H + 80 || w.x < -80 || w.x > W + 80)) return end("crash", "Despencou", "O esquiador saiu da pista e caiu montanha abaixo.");
  vNow = (Math.hypot(a.vx, a.vy) + Math.hypot(b.vx, b.vy)) / 2;
  const [cx, cy] = local(18, 20), [gx, gy] = L().goal, dist = Math.hypot(cx - gx, cy - gy);
  if (dist < GOAL_R) return end("win", "Chegou inteiro!", `Levou ${sec(tRun)} e cruzou a chegada a ${ms(vNow)}.`);
  if (dist < best - 2) { best = dist; stale = 0; } else stale += dt; // stopped or rocking in a valley = no new closest approach
  if (stale > 3.5) return end("crash", "Não chegou lá", "O esquiador perdeu o embalo. Só a gravidade empurra: a chegada precisa ficar mais baixa que o ponto mais alto do caminho.", false);
  if (tRun > T_MAX) return end("crash", "Tempo esgotado", `Passaram ${T_MAX} s e o esquiador não chegou.`, false);
}
function end(kind, title, text, boom = true) {
  state = kind;
  if (kind === "win") {
    if (!reduce) burst(...local(18, 20));
    done.add(lvl); try { localStorage.setItem("ladeira-ski-done", JSON.stringify([...done])); } catch {}
    renderLevels();
  } else if (boom) shatter();
  clearTimeout(endTimer);
  endTimer = setTimeout(() => showCard(kind, title, text), kind === "win" ? 650 : 1100);
  refresh();
}
function burst(x, y) {
  const keys = ["ok", "ink", "hazard", "car"];
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 250, life: 1, key: keys[i % 4], r: Math.random() * 6 });
  }
}

// ---- crash: the skier breaks apart and bleeds ----
function shatter() {
  const vx = (car.w[0].vx + car.w[1].vx) / 2, vy = (car.w[0].vy + car.w[1].vy) / 2;
  const power = clamp(Math.hypot(vx, vy) * .35, 160, 420);
  rag = PARTS.map(p => {
    const A = local(p.a[0], -p.a[1]), B = local(p.b[0], -p.b[1]), ang = Math.random() * Math.PI * 2, s = power * (.3 + Math.random() * .7);
    return { ...p, x: (A[0] + B[0]) / 2, y: (A[1] + B[1]) / 2, hx: (B[0] - A[0]) / 2, hy: (B[1] - A[1]) / 2,
      vx: vx * .5 + Math.cos(ang) * s, vy: vy * .5 + Math.sin(ang) * s - power * .4, av: (Math.random() - .5) * 16, bleed: p.bleed || 0 };
  });
  const [cx, cy] = local(20, 24);
  for (let i = 0; i < 70; i++) {
    const ang = Math.random() * Math.PI * 2, s = Math.random() * power * 1.1;
    drops.push({ x: cx, y: cy, vx: vx * .3 + Math.cos(ang) * s, vy: vy * .3 + Math.sin(ang) * s - 120 });
  }
}
function stepRag(dt) {
  const h = dt / 3;
  for (let n = 0; n < 3; n++) for (const p of rag) {
    p.vy += G * h; p.x += p.vx * h; p.y += p.vy * h;
    const c = Math.cos(p.av * h), s = Math.sin(p.av * h);
    [p.hx, p.hy] = [p.hx * c - p.hy * s, p.hx * s + p.hy * c];
    const r = p.w / 2 + 1;
    for (const [ex, ey] of [[p.x + p.hx, p.y + p.hy], [p.x - p.hx, p.y - p.hy]]) {
      const t = touch(ex, ey, r); if (!t) continue;
      let nx = ex - t[0], ny = ey - t[1]; const d = t[2] || 1e-4; nx /= d; ny /= d;
      p.x += nx * (r - d); p.y += ny * (r - d);
      const vn = p.vx * nx + p.vy * ny;
      if (vn < 0) { p.vx -= nx * vn * 1.3; p.vy -= ny * vn * 1.3; p.vx *= .9; p.vy *= .9; p.av *= .7; }
    }
  }
  for (const p of rag) if (p.bleed > 0) {
    p.bleed -= dt;
    if (Math.random() < .55) drops.push({ x: p.x, y: p.y, vx: p.vx * .3 + (Math.random() - .5) * 60, vy: p.vy * .3 - Math.random() * 40 });
  }
  rag = rag.filter(p => p.y < H + 200);
}
function stepDrops(dt) {
  for (const d of drops) {
    d.vy += G * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    const t = touch(d.x, d.y, 3), inHaz = L().haz.some(h => h.length < 5 && d.x > h[0] && d.x < h[0] + h[2] && d.y > h[1] && d.y < h[1] + h[3]);
    if (t || inHaz) { stains.push({ x: t ? t[0] : d.x, y: t ? t[1] : d.y, r: 1.5 + Math.random() * 3 }); d.dead = true; }
    else if (d.y > H + 20) d.dead = true;
  }
  drops = drops.filter(d => !d.dead);
  if (stains.length > 900) stains.splice(0, stains.length - 900);
}

// ---- UI ----
const overlay = $("#overlay");
function showCard(kind, title, text) {
  const last = lvl === LEVELS.length - 1;
  $("#card").dataset.kind = kind;
  $("#cTitle").textContent = title;
  $("#cText").textContent = text + (kind === "win" && last ? " Você venceu todas as fases!" : "");
  $("#next").hidden = !(kind === "win" && !last);
  overlay.hidden = false;
  ($("#next").hidden ? $("#retry") : $("#next")).focus();
}
function reset() {
  clearTimeout(endTimer); overlay.hidden = true;
  state = "edit"; parts = []; rag = []; drops = []; stains = []; tRun = 0; spawn(); refresh();
}
function play() {
  if (state !== "edit") return reset();
  spawn(); tRun = 0; tHaz = 0; best = Infinity; stale = 0; vNow = 0; state = "run"; refresh();
}
function select(i) { lvl = i; cleared = null; rebuild(); reset(); renderLevels(); }
function undo() {
  if (state !== "edit") return;
  if (drawings[lvl].length) drawings[lvl].pop();
  else if (cleared) { drawings[lvl] = cleared; cleared = null; }
  rebuild(); refresh();
}
function clearAll() {
  if (state !== "edit" || !drawings[lvl].length) return;
  cleared = drawings[lvl]; drawings[lvl] = []; rebuild(); refresh();
}
function renderLevels() {
  const sel = $("#lvlSel");
  sel.replaceChildren(...LEVELS.map((l, i) => new Option(`${i + 1}. ${l.name}${i >= 6 ? " ↔" : ""}${done.has(i) ? "  ✓" : ""}`, i)));
  sel.value = lvl;
}
$("#lvlSel").onchange = e => select(+e.target.value);
function orient() { // sideways mode on a portrait screen = turn the app so the phone can be held sideways
  const r = document.documentElement.style;
  r.setProperty("--vw", innerWidth + "px"); r.setProperty("--vh", innerHeight + "px");
  document.body.classList.toggle("turn", land && innerHeight > innerWidth);
}
function setLand(on) {
  land = on; W = land ? 1000 : 700; H = land ? 700 : 1000; drawings = sketches[land];
  try { localStorage.setItem("ladeira-land", land ? "1" : "0"); } catch {}
  $(".app").classList.toggle("land", land);
  $("#turn").textContent = land ? "⟳ Em pé" : "⟳ Deitar";
  orient(); fit(); select(lvl);
}
$("#turn").onclick = () => setLand(!land);
addEventListener("resize", orient);
function refresh() {
  const [x1, y1, x2, y2] = L().start, drop = L().goal[1] - (y1 + y2) / 2;
  let ink = 0; for (const st of drawings[lvl]) for (let i = 1; i < st.length; i++) ink += Math.hypot(st[i][0] - st[i-1][0], st[i][1] - st[i-1][1]);
  $("#info").textContent = `Fase ${lvl + 1}/${LEVELS.length} · ${L().name}`;
  $("#more").textContent = ` · desnível ${m(drop)} · pista ${m(ink)} · aguenta pancada até ${ms(CRASH_V)}`;
  const edit = state === "edit";
  $("#play").textContent = edit ? "▶ Play" : state === "run" ? "■ Parar" : "↺ Redesenhar";
  $("#undo").disabled = !edit || (!drawings[lvl].length && !cleared);
  $("#clear").disabled = !edit || !drawings[lvl].length;
  cv.classList.toggle("busy", !edit);
}
$("#play").onclick = play;
$("#undo").onclick = undo;
$("#clear").onclick = clearAll;
$("#retry").onclick = reset;
$("#next").onclick = () => select(lvl + 1);
addEventListener("keydown", e => {
  if (e.target.closest?.("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.code === "Space") { e.preventDefault(); play(); }
  else if (e.key.toLowerCase() === "z") undo();
  else if (e.key === "Escape" && state !== "edit") reset();
});

// ---- drawing input ----
function toWorld(e) {
  const r = cv.getBoundingClientRect(), turned = document.body.classList.contains("turn");
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (turned) [dx, dy] = [dy, -dx]; // undo the 90° CSS turn
  const w = turned ? r.height : r.width, h = turned ? r.width : r.height;
  return [(dx / w + .5) * W, (dy / h + .5) * H];
}
cv.addEventListener("pointerdown", e => {
  if (state !== "edit") return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId); stroke = [snap(toWorld(e))];
});
// a stroke that starts near the pad end or another stroke's end continues it seamlessly (no ledge to fall off)
function snap(p) {
  const ends = [L().start.slice(2), ...drawings[lvl].map(st => st[st.length - 1])];
  let best = p, bd = 40;
  for (const q of ends) { const d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (d < bd) { bd = d; best = [q[0], q[1]]; } }
  return best;
}
cv.addEventListener("pointermove", e => {
  if (!stroke) return;
  for (const ev of e.getCoalescedEvents?.() || [e]) {
    const p = toWorld(ev), q = stroke[stroke.length - 1];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) >= 6) stroke.push(p);
  }
});
const endStroke = () => {
  if (!stroke) return;
  if (stroke.length > 1) { drawings[lvl].push(stroke); cleared = null; rebuild(); refresh(); }
  stroke = null;
};
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);

// ---- rendering ----
function fit() {
  const s = Math.max(.1, Math.min(board.clientWidth / W, board.clientHeight / H)), d = devicePixelRatio || 1;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d);
}
new ResizeObserver(fit).observe(board);

let hazPat = null, hazKey = "";
function hazard(c1, c2) {
  if (hazKey !== c1 + c2) {
    const p = document.createElement("canvas"); p.width = p.height = 20;
    const g = p.getContext("2d");
    g.fillStyle = c1; g.fillRect(0, 0, 20, 20); g.strokeStyle = c2; g.lineWidth = 5; g.beginPath();
    for (let i = -20; i <= 40; i += 10) { g.moveTo(i, 20); g.lineTo(i + 20, 0); }
    g.stroke(); hazPat = ctx.createPattern(p, "repeat"); hazKey = c1 + c2;
  }
  return hazPat;
}
function line(pts, color, width) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = ctx.lineJoin = "round";
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
}
function label(text, x, y, color, size, paper, align = "center") {
  ctx.font = `700 ${size}px ${css("f-hand")}`; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = 5; ctx.strokeStyle = paper; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
let cs = null;
const css = n => cs.getPropertyValue("--" + n).trim();

function draw() {
  cs = getComputedStyle(document.documentElement);
  const C = {};
  for (const n of ["paper", "grid", "grid-major", "ink", "graphite", "muted", "car", "glass", "hazard", "ok", "skin", "pants", "blood"]) C[n] = css(n);
  const k = cv.width / W, hair = W / (cv.clientWidth || W);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);

  // engineering-pad grid: 20 cm minor, 1 m major
  for (const [step, color] of [[20, C.grid], [100, C["grid-major"]]]) {
    ctx.strokeStyle = color; ctx.lineWidth = hair; ctx.beginPath();
    for (let x = step; x < W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = step; y < H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  for (const hz of L().haz) {
    if (hz.length > 4) { // travel lane of a moving obstacle
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5;
      ctx.strokeRect(Math.min(hz[0], hz[0] + hz[4]), Math.min(hz[1], hz[1] + hz[5]), hz[2] + Math.abs(hz[4]), hz[3] + Math.abs(hz[5]));
      ctx.restore();
    }
    const [x, y, w, h] = hazAt(hz);
    ctx.fillStyle = hazard(C.hazard, C.graphite + "55"); ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = C.graphite; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  }
  // scale bar
  line([[24, H - 30], [124, H - 30]], C.muted, 2);
  line([[24, H - 36], [24, H - 24]], C.muted, 2); line([[124, H - 36], [124, H - 24]], C.muted, 2);
  ctx.font = `500 13px ${css("f-mono")}`; ctx.fillStyle = C.muted; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText("1 m    g = 9,81 m/s²", 34, H - 48);

  // goal
  const [gx, gy] = L().goal;
  ctx.fillStyle = C.ok; ctx.globalAlpha = .13; ctx.beginPath(); ctx.arc(gx, gy, GOAL_R, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.save(); ctx.setLineDash([8, 7]); ctx.strokeStyle = C.ok; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(gx, gy, GOAL_R, 0, 7); ctx.stroke(); ctx.restore();
  const fx = gx + 4, fy = gy - GOAL_R - 4;
  line([[fx, fy], [fx, fy - 40]], C.graphite, 2.5);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { ctx.fillStyle = (i + j) % 2 ? C.paper : C.graphite; ctx.fillRect(fx + i * 6, fy - 40 + j * 6, 6, 6); }
  ctx.strokeStyle = C.graphite; ctx.lineWidth = 1.5; ctx.strokeRect(fx, fy - 40, 24, 18);
  const right = gx > W - 160;
  label("CHEGADA", right ? gx - 6 : gx + 34, fy - 12, C.ok, 20, C.paper, right ? "right" : "left");

  // start pad
  const [x1, y1, x2, y2] = L().start;
  line([[x1, y1], [x2, y2]], C.graphite, 6);
  label("INÍCIO", (x1 + x2) / 2, Math.max(16, Math.min(y1, y2) - 72), C.graphite, 20, C.paper);

  for (const st of drawings[lvl]) line(st, C.ink, 4);
  if (stroke) line(stroke, C.ink, 4);
  if (state === "edit" && !drawings[lvl].length && !stroke) {
    label("Arraste o dedo para desenhar", W / 2, H / 2 - 18, C.muted, 30, C.paper);
    label("a pista do INÍCIO até a CHEGADA", W / 2, H / 2 + 22, C.muted, 30, C.paper);
  }

  ctx.fillStyle = C.blood;
  for (const s of stains) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  if (rag.length) drawRag(C); else drawSkier(C);
  ctx.fillStyle = C.blood;
  for (const d of drops) { ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, 7); ctx.fill(); }

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = C[p.key];
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-3, -2, 6, 4); ctx.restore();
  }
  ctx.globalAlpha = 1;

  if (state !== "edit") {
    ctx.font = `500 20px ${css("f-mono")}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const t = `t ${sec(tRun)}   v ${ms(vNow)}`;
    ctx.lineWidth = 5; ctx.strokeStyle = C.paper; ctx.strokeText(t, W / 2, 26); ctx.fillStyle = C.graphite; ctx.fillText(t, W / 2, 26);
  }
}
// one body part as a thick outlined stroke between a and b (coords in the current transform)
function limb(C, p, ax, ay, bx, by) {
  ctx.lineCap = "round";
  if (p.head) {
    const r = p.w / 2;
    ctx.fillStyle = C.graphite; ctx.beginPath(); ctx.arc(ax, ay, r + 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(ax, ay, r, 0, 7); ctx.fill();
    return;
  }
  if (p.k !== "graphite") { ctx.strokeStyle = C.graphite; ctx.lineWidth = p.w + 2.4; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  ctx.strokeStyle = C[p.k]; ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
}
function drawSkier(C) {
  const a = car.w[0], f = basis();
  ctx.save(); ctx.translate(a.x, a.y); ctx.transform(f.ux, f.uy, -f.nx, -f.ny, 0, 0); // local: x forward, y down
  for (const p of PARTS) {
    if (p.ski) { // ski with an upturned tip
      ctx.strokeStyle = C.graphite; ctx.lineWidth = p.w; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-10, 9); ctx.lineTo(44, 9); ctx.quadraticCurveTo(51, 9, 53, 3); ctx.stroke();
      continue;
    }
    limb(C, p, p.a[0], p.a[1], p.b[0], p.b[1]);
  }
  // beanie and goggles
  ctx.fillStyle = C.car; ctx.beginPath(); ctx.arc(25, -38, 5.6, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(24, -45.5, 2.2, 0, 7); ctx.fill();
  ctx.fillStyle = C.glass; ctx.strokeStyle = C.graphite; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(26, -39.5, 5, 3, 1); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawRag(C) {
  for (const p of rag) limb(C, p, p.x + p.hx, p.y + p.hy, p.x - p.hx, p.y - p.hy);
  ctx.fillStyle = C.blood; // open wounds on the torn ends
  for (const p of rag) if (!p.head && p.k !== "graphite") { ctx.beginPath(); ctx.arc(p.x + p.hx, p.y + p.hy, Math.min(3.2, p.w / 2), 0, 7); ctx.fill(); }
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
  if (state === "run") update(dt);
  else if (state === "edit") tHaz += dt;
  if (rag.length) stepRag(dt);
  if (drops.length) stepDrops(dt);
  for (const p of parts) { p.vy += G * .6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 8; p.life -= dt * .7; }
  parts = parts.filter(p => p.life > 0);
  draw();
  requestAnimationFrame(loop);
}

window.claude?.hot?.snapshot?.(() => ({ v: 3, lvl, land, sketches, done: [...done] }));
function start(d = {}) {
  if (d.v === 3 && d.sketches?.false?.length === LEVELS.length) { sketches.false = d.sketches.false; sketches.true = d.sketches.true; }
  if (d.v === 3 && Number.isInteger(d.lvl) && LEVELS[d.lvl]) lvl = d.lvl;
  if (d.v === 3) land = !!d.land;
  if (Array.isArray(d.done)) d.done.forEach(i => done.add(i));
  setLand(land); requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
