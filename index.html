<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Ladeira Abaixo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: one-screen portrait slope — title strip, tall engineering-pad board (blueprint in dark), thumb-reach control strip */
:root{
  --paper:#f1f4ea; --grid:#d6e2ca; --grid-major:#b3c9a2;
  --desk:#dde4d1; --panel:#e9eee0; --edge:#b6c5a8;
  --ink:#1d3f9e; --graphite:#262b24; --muted:#5b6753;
  --car:#d4252c; --on-car:#ffffff; --glass:#cfe6f2;
  --skin:#f0c29c; --pants:#2c3a66; --blood:#a5101a;
  --hazard:#efb21a; --ok:#1f8446; --bad:#c22a2a;
  --fire:#f0561d; --gold:#d19a00; --ice:#1f9fd6; --slow:#7a4bd0; --snow:#ffffff; --snow-edge:#8fa9bd;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15396a; --grid:#1d4780; --grid-major:#2f5f9f;
    --desk:#0b2040; --panel:#112c52; --edge:#2b5690;
    --ink:#f3efdc; --graphite:#e6edf7; --muted:#9fb5d4;
    --car:#ff5a52; --on-car:#2a0606; --glass:#bfe3ff;
    --skin:#f5cfae; --pants:#1b2440; --blood:#e3263a;
    --hazard:#ffb627; --ok:#62d68b; --bad:#ff8a80;
    --fire:#ff6a2b; --gold:#ffcf3f; --ice:#6fd3ff; --slow:#b892ff; --snow:#e9f2ff; --snow-edge:#9fb5d4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15396a; --grid:#1d4780; --grid-major:#2f5f9f;
  --desk:#0b2040; --panel:#112c52; --edge:#2b5690;
  --ink:#f3efdc; --graphite:#e6edf7; --muted:#9fb5d4;
  --car:#ff5a52; --on-car:#2a0606; --glass:#bfe3ff;
  --skin:#f5cfae; --pants:#1b2440; --blood:#e3263a;
  --hazard:#ffb627; --ok:#62d68b; --bad:#ff8a80;
  --fire:#ff6a2b; --gold:#ffcf3f; --ice:#6fd3ff; --slow:#b892ff; --snow:#e9f2ff; --snow-edge:#9fb5d4;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--desk);color:var(--graphite);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
.bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-hand);font-weight:700;font-size:2rem;line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.tag{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pick{margin-left:auto;display:flex;gap:8px;min-width:0}
/* level menu button: drawn by the page (a native select's popup would not turn with the app in sideways mode) */
#lvlBtn{min-width:0;max-width:16rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.6rem .7rem;line-height:1.2}
.lvsec{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:6px}
.lvsec button{text-align:left;padding:.55rem .7rem;line-height:1.25;font-weight:600}
.lvsec button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.board{flex:1;min-height:0;display:grid;place-items:center;position:relative}
canvas{display:block;border-radius:6px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1.5px var(--edge),0 14px 30px -20px rgba(0,0,0,.55)}
canvas.busy{cursor:default}
.controls{justify-content:space-between}
.info{margin:0;flex:1 1 16rem;min-width:0;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
button{font:600 .95rem/1 var(--f-ui);padding:.65rem 1rem;border-radius:8px;border:1.5px solid var(--edge);background:var(--panel);color:var(--graphite);cursor:pointer;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--graphite)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.primary{background:var(--car);border-color:var(--car);color:var(--on-car);font-weight:800;min-width:8rem}
/* character and vehicle picker: covers the app (and turns with it in sideways mode) */
.app{position:relative}
.picker{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:12px;background:rgba(10,20,30,.45)}
.pk{position:relative;width:min(100%,40rem);max-height:100%;overflow:auto;display:grid;gap:.6rem;background:var(--paper);border:2px solid var(--graphite);border-radius:10px;padding:1rem 1.1rem 1.1rem;box-shadow:6px 6px 0 var(--graphite)}
.pk h2{margin:0;font-family:var(--f-hand);font-weight:700;font-size:1.9rem;line-height:1.05;color:var(--ink)}
.pk h3{margin:.2rem 0 0;font:600 .8rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:8px}
.opt{display:grid;gap:4px;justify-items:center;padding:6px 4px 8px;font-weight:600}
.opt canvas{width:100%;aspect-ratio:4/3;height:auto;box-shadow:none;border-radius:4px;cursor:pointer;background:var(--paper)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.opt small{font:500 .68rem/1.2 var(--f-mono);color:var(--muted);letter-spacing:.02em;text-align:center}
.vnote{margin:0;line-height:1.4;min-height:2.8em}
.pk .btns{justify-content:flex-end}
/* bag of magic items: two slots; the dragon slot is a button */
.bag{display:flex;gap:6px;align-items:stretch}
.slot{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1.5px dashed var(--edge);border-radius:8px;font:600 .8rem/1.15 var(--f-ui);color:var(--muted);min-height:2.5rem;min-width:0}
.slot.empty{padding:3px 10px}
.slot.full{border-style:solid;color:var(--graphite);background:var(--panel)}
button.slot{cursor:pointer;border-color:var(--gold)}
.slot canvas{width:30px;height:30px;flex:none;box-shadow:none;border-radius:50%;cursor:inherit}
.app.land .bag{gap:6px}
.app.land .slot{flex:1;justify-content:center;padding:3px;min-height:2.4rem}
.app.land .slot span{display:none} /* sideways the column is short: icons only, the name is in the tooltip */
/* sideways: board on the left, controls in a column on the right */
.app.land{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 10rem;grid-template-rows:auto 1fr;gap:8px 12px}
.app.land .board{grid-column:1;grid-row:1/3}
.app.land header,.app.land footer{grid-column:2;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px} /* nowrap: a wrapping column grows to its widest child */
.app.land footer{grid-row:2;justify-content:flex-end}
.app.land h1{font-size:1.45rem}
.app.land .tag,.app.land .info .more{display:none}
.app.land .pick{margin-left:0;flex-direction:column}
.app.land #who{white-space:normal}
.app.land #lvlBtn{max-width:none}
.app.land .info{flex:0 0 auto}
.app.land .controls .btns{flex-direction:column}
.app.land .controls .btns button{height:2.6rem}
.app.land .info{display:none} /* the level button already names the level */
.app.land button.primary{min-width:0}
/* phone held sideways with rotation lock: turn the whole app a quarter */
body.turn .app{position:fixed;top:0;left:var(--vw);width:var(--vh);height:var(--vw);margin:0;transform-origin:0 0;transform:rotate(90deg)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;display:grid;gap:.7rem;max-width:22rem;background:var(--paper);border:2px solid var(--graphite);border-radius:10px;padding:1.1rem 1.3rem 1.2rem;box-shadow:6px 6px 0 var(--graphite)}
.card h2{margin:0;font-family:var(--f-hand);font-weight:700;font-size:2.1rem;line-height:1.05;color:var(--bad);text-wrap:balance}
.card[data-kind="win"] h2{color:var(--ok)}
.card p{margin:0;line-height:1.45}
.card .btns button{flex:1}
@media (max-width:560px){
  .app{padding-inline:12px;gap:6px}
  h1{font-size:1.5rem}
  .tag,.info .more{display:none}
  .app:not(.land) .pick{margin-left:0;width:100%}
  .app:not(.land) #lvlBtn{flex:1;max-width:none}
  .app:not(.land) .info{flex-basis:100%;text-align:center}
  .app:not(.land) .bag{width:100%;justify-content:center}
  .app:not(.land) .controls .btns{width:100%}
  .app:not(.land) .controls .btns button{flex:1;height:3.2rem;padding:0 .5rem}
  .app:not(.land) button.primary{min-width:0;flex:1.6!important}
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><h1>Ladeira Abaixo</h1><span class="tag">esqui sem bastão · só gravidade</span></div>
    <div class="pick">
      <button id="lvlBtn" aria-haspopup="dialog" title="Escolher fase"></button>
      <button id="who" title="Escolher personagem e transporte" aria-haspopup="dialog"></button>
      <button id="turn" title="Trocar entre jogar em pé e deitado">⟳ Deitar</button>
    </div>
  </header>
  <main class="board" id="board">
    <canvas id="cv" aria-label="Montanha: arraste para desenhar a pista de neve"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="card" role="dialog" aria-live="polite">
        <h2 id="cTitle"></h2>
        <p id="cText"></p>
        <div class="btns"><button id="retry">Tentar de novo</button><button id="next" class="primary">Próxima fase</button></div>
      </div>
    </div>
  </main>
  <div class="picker" id="lvlMenu" role="dialog" aria-modal="true" aria-labelledby="lvTitle" hidden>
    <div class="pk">
      <h2 id="lvTitle">Escolha a fase</h2>
      <div id="lvList"></div>
      <div class="btns"><button id="lvClose">Fechar</button></div>
    </div>
  </div>
  <div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pkTitle" hidden>
    <div class="pk">
      <h2 id="pkTitle">Quem desce, e em quê?</h2>
      <h3>Personagem</h3>
      <div class="opts" id="chars"></div>
      <h3>Transporte</h3>
      <div class="opts" id="vehs"></div>
      <p class="vnote" id="vnote"></p>
      <div class="btns"><button id="pkOk" class="primary">Descer!</button></div>
    </div>
  </div>
  <footer class="bar controls">
    <p class="info"><span id="info"></span><span class="more" id="more"></span></p>
    <div class="bag" id="bag" role="group" aria-label="Bolsa de itens mágicos"></div>
    <div class="btns">
      <button id="undo">Desfazer</button>
      <button id="clear">Limpar</button>
      <button id="play" class="primary">▶ Play</button>
    </div>
  </footer>
</div>

<script>
// World units: 100 px = 1 m, portrait slope. The skier rides on two ski contact points joined by a rigid
// link (position-based dynamics); the body is drawn on top and only checked for hits.
let W = 700, H = 1000; const PX = 100, G = 9.81 * PX, R = 9, AXLE = 36, SUB = 10;
const CRASH_BASE = 750, VMAX = 2500, GOAL_R = 42, SPIN = 3.5, T_MAX = 40;
// Levels are authored for the 700×1000 portrait slope; sideways play stretches them to 1000×700.
// start: launch pad [x1,y1,x2,y2] (skier faces from 1 to 2); goal: [x,y]
// haz: deadly rects [x,y,w,h] — moving ones add [dx,dy,period s,phase 0..1] and sweep from x,y to x+dx,y+dy and back
// fire: flame vents [x,y,w,h,period s,lit 0..1,phase 0..1,nozzle] — the rect burns for the lit share of each period;
//   nozzle is the side the flames shoot from: 0 bottom, 1 top, 2 left, 3 right
// aval: [delay s, speed px/s, accel px/s²] — a snow front starts behind the pad and sweeps toward the goal
// atk: ["aguia", x, y, delay s, speed px/s] chases the skier; ["canhao", x, y, first shot s, every s, ball px/s] fires fireballs
//   aimed where the skier would be if it kept going straight
// items: [x, y, kind] — power-ups for this run only: "turbo" pushes for 3 s, "lento" brakes for 3 s,

  const cap = () => { g.fillStyle = P.hat; g.beginPath(); g.arc(hx, hy, 5.6, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); g.fill(); };
  const goggles = () => { g.fillStyle = P.glass; g.beginPath(); g.roundRect(hx + 1, hy - 1.5, 5, 3, 1); g.fill(); g.stroke(); };
  if (ch.look === "gorro") { cap(); g.beginPath(); g.arc(hx - 1, hy - 7.5, 2.2, 0, 7); g.fill(); goggles(); }
  else if (ch.look === "rabo") {
    g.fillStyle = P.hair; g.beginPath(); g.ellipse(hx - 8, hy + 1, 4.5, 2.4, .5, 0, 7); g.fill();
    g.beginPath(); g.arc(hx, hy, 5.7, Math.PI * .85, Math.PI * 1.6); g.lineTo(hx, hy); g.fill();
    cap(); goggles();
  } else if (ch.look === "barba") {
    g.fillStyle = P.hair; g.beginPath(); g.ellipse(hx + 2.5, hy + 3.4, 4.2, 3.2, 0, 0, 7); g.fill();
    g.fillStyle = P.hat; g.beginPath(); g.arc(hx, hy - 1, 5.8, Math.PI, 0); g.closePath(); g.fill(); g.fillRect(hx - 1, hy - 2, 9, 1.8);
    g.fillStyle = P.graphite; g.beginPath(); g.arc(hx + 3, hy, .9, 0, 7); g.fill();
  } else if (ch.look === "faixa") {
    g.fillStyle = P.hair; g.beginPath(); g.arc(hx, hy, 5.7, Math.PI * .9, Math.PI * 1.9); g.closePath(); g.fill();
    g.strokeStyle = P.hat; g.lineWidth = 2.2; g.beginPath(); g.moveTo(hx - 5, hy - 2.6); g.lineTo(hx + 5.4, hy - 2.6); g.stroke();
    g.lineWidth = 1; g.strokeStyle = P.graphite; goggles();
  } else if (ch.look === "pinguim") {
    g.fillStyle = "#f6f6f2"; g.beginPath(); g.ellipse(hx + 2.2, hy + .8, 3.4, 4, 0, 0, 7); g.fill();
    g.fillStyle = P.graphite; g.beginPath(); g.arc(hx + 3, hy - 1, 1, 0, 7); g.fill();
    g.fillStyle = P.hat; g.beginPath(); g.moveTo(hx + 4.5, hy - .5); g.lineTo(hx + 10, hy + 1.2); g.lineTo(hx + 4.5, hy + 2.6); g.closePath(); g.fill();
  }
  if (helmet) {
    g.fillStyle = P.gold; g.strokeStyle = P.graphite; g.lineWidth = 1.2;
    g.beginPath(); g.arc(hx, hy, 7.2, Math.PI * .95, Math.PI * 2.05); g.closePath(); g.fill(); g.stroke();
  }
}
// the whole rider in rider-local coordinates (x forward, y down from the rear contact)
function paintRider(g, P, ch, vh, t = 0, helmet = false) {
  for (const p of vh.parts) {
    paintPart(g, P, p, p.a[0], p.a[1], p.b[0], p.b[1], t);
    if (ch.look === "pinguim" && p.k === "jacket" && p.w === 8) { // white belly down the front of the torso
      g.strokeStyle = "#f6f6f2"; g.lineWidth = 3.4; g.beginPath(); g.moveTo(p.a[0] + 2.5, p.a[1] - 2); g.lineTo(p.b[0] + 2.5, p.b[1] + 3); g.stroke();
    }
  }
  paintHead(g, P, ch, vh.head[0], vh.head[1], helmet);
}
function drawSkier(C, now = 0) {
  const a = car.w[0], f = basis();
  ctx.save(); ctx.translate(a.x, a.y); ctx.transform(f.ux, f.uy, -f.nx, -f.ny, 0, 0); // local: x forward, y down
  if (fx?.grace > 0 && Math.floor(now * 12) % 2) ctx.globalAlpha = .35; // magic just took a hit
  const act = fx ? activeMagic() : [], P = palette(C, CHAR());
  paintRider(ctx, P, CHAR(), VEH(), now, fx?.shield > 0 && act.includes("capacete"));
  if (fx?.shield > 0 && act.includes("bolha")) { // the bubble wraps the rider
    const [mx, my] = VEH().mid;
    ctx.fillStyle = P.glass; ctx.globalAlpha *= .3; ctx.beginPath(); ctx.arc(mx, -my, 40, 0, 7); ctx.fill();
    ctx.globalAlpha /= .3; ctx.strokeStyle = P.ice; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}
function drawRag(C) {
  const P = palette(C, CHAR());
  for (const p of rag) paintPart(ctx, P, p, p.x + p.hx, p.y + p.hy, p.x - p.hx, p.y - p.hy);
  ctx.fillStyle = C.blood; // open wounds on the torn ends
  for (const p of rag) if (!p.head && !p.shape && p.k !== "gear" && p.k !== "wood" && p.k !== "metal") { ctx.beginPath(); ctx.arc(p.x + p.hx, p.y + p.hy, Math.min(3.2, p.w / 2), 0, 7); ctx.fill(); }
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
  if (state === "run") update(dt);
  else if (state === "edit") tHaz += dt;
  else if (state === "dragon" && (dragonT += dt) >= DRAGON_T) end("win", "O dragão te levou!", "Voou direto até a chegada, sem um arranhão.", true, true);
  if (rag.length) stepRag(dt);
  if (drops.length) stepDrops(dt);
  for (const p of parts) { p.vy += G * .6 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 8; p.life -= dt * .7; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 40 * dt; f.life -= dt * .6; }
  floaters = floaters.filter(f => f.life > 0);
  draw();
  requestAnimationFrame(loop);
}

window.claude?.hot?.snapshot?.(() => ({ v: 3, lvl, land, sketches, done: [...done], rider }));
function start(d = {}) {
  if (d.v === 3 && d.sketches?.false?.length === LEVELS.length) { sketches.false = d.sketches.false; sketches.true = d.sketches.true; }
  if (d.v === 3 && Number.isInteger(d.lvl) && LEVELS[d.lvl]) lvl = d.lvl;
  if (d.v === 3) land = !!d.land;
  if (Array.isArray(d.done)) d.done.forEach(i => done.add(i));
  if (d.rider && CHARACTERS[d.rider.ch] && VEHICLES[d.rider.vh]) rider = d.rider;
  toughen(); $("#who").textContent = `${CHAR().name} · ${VEH().name}`;
  setLand(land); requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
